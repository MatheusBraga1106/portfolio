# Portfólio do Matheus Braga: um container, duas versões escolhidas pelo endereço.
#   ia.matheusbrg.com          → /ia/index.html       (versão para vagas de IA)
#   matheusbrg.com e www.      → /clientes/index.html (versão para clientes)
# Fica em /etc/nginx/conf.d/default.conf (dentro do bloco http do nginx).

map $host $versao {
    ~^ia\.  ia;
    default clientes;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    # usado pelo Docker para saber se o site está de pé
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # a página da versão (sem cache longo: uma mudança aparece na hora)
    location = / {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files /$versao/index.html =404;
    }

    # robots e sitemap de cada versão
    location = /robots.txt  { include /etc/nginx/seguranca.conf; try_files /robots-$versao.txt =404; }
    location = /sitemap.xml { include /etc/nginx/seguranca.conf; try_files /sitemap-$versao.xml =404; }
    location = /favicon.svg { include /etc/nginx/seguranca.conf; add_header Cache-Control "public, max-age=604800" always; }

    # bibliotecas, fontes e imagens mudam pouco: cache de 30 dias
    location ~ ^/assets/(vendor|fonts|img)/ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }
    # CSS e JS do próprio site mudam a cada versão (os nomes não mudam): cache de 1 hora
    location /assets/ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    # cada versão tem um endereço só: as pastas diretas e o resto não existem
    location / {
        return 404;
    }
}
